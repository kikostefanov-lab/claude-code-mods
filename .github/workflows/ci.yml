name: CI

on:
  push:
  pull_request:

jobs:
  whiteboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code and mermaid-cli
        run: npm i -g @anthropic-ai/claude-code @mermaid-js/mermaid-cli
      - name: Validate the plugin
        run: claude plugin validate whiteboard
      - name: Run the plugin tests
        run: claude plugin test whiteboard
      - name: Smoke test the real mmdc
        run: |
          echo '{ "args": ["--no-sandbox"] }' > "$RUNNER_TEMP/puppeteer.json"
          PUPPETEER_CONFIG="$RUNNER_TEMP/puppeteer.json" whiteboard/scripts/smoke-mmdc.sh
